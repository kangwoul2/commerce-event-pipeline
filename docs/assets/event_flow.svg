<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Commerce event flow</title><desc id="desc">Purchase API publishes region-keyed events to Kafka. A consumer group projects idempotent regional sales into PostgreSQL.</desc><rect width="1000" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#4b5563;stroke-width:2}.arrow{stroke:#6b7280;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs><text x="45" y="48" font-size="25" font-weight="700">Commerce event projection</text><rect class="box" x="45" y="125" width="170" height="80" rx="8"/><text x="83" y="160" font-size="16">Purchase API</text><text x="68" y="184" font-size="13">202 Accepted</text><rect class="box" x="310" y="125" width="190" height="80" rx="8"/><text x="374" y="160" font-size="16">Kafka</text><text x="336" y="184" font-size="13">key = region</text><rect class="box" x="595" y="125" width="180" height="80" rx="8"/><text x="624" y="160" font-size="16">Projection consumer</text><text x="623" y="184" font-size="13">consumer group</text><rect class="box" x="835" y="125" width="130" height="80" rx="8"/><text x="859" y="160" font-size="16">PostgreSQL</text><text x="852" y="184" font-size="13">projection</text><line class="arrow" x1="215" y1="165" x2="310" y2="165"/><line class="arrow" x1="500" y1="165" x2="595" y2="165"/><line class="arrow" x1="775" y1="165" x2="835" y2="165"/><text x="45" y="280" font-size="15" font-weight="700">Reliability path</text><text x="45" y="315" font-size="14">same eventId replay → INSERT processed_events ... ON CONFLICT DO NOTHING → duplicate projection skipped</text><text x="45" y="345" font-size="14">regional aggregate → atomic PostgreSQL upsert → no read-modify-write lost update</text><text x="45" y="375" font-size="13" fill="#6b7280">Kafka handles delivery and ordering; PostgreSQL constraints/atomic SQL protect state consistency.</text></svg>
