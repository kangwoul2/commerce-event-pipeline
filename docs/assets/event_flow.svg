<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">구매 이벤트 처리 흐름</title><desc id="desc">구매 API가 지역을 키로 사용해 Kafka에 이벤트를 발행하고, 소비자 그룹이 PostgreSQL의 지역별 매출을 멱등하게 집계합니다.</desc><rect width="1000" height="420" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#4b5563;stroke-width:2}.arrow{stroke:#6b7280;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs><text x="45" y="48" font-size="25" font-weight="700">구매 이벤트 집계 흐름</text><rect class="box" x="45" y="125" width="170" height="80" rx="8"/><text x="83" y="160" font-size="16">구매 API</text><text x="68" y="184" font-size="13">202 Accepted</text><rect class="box" x="310" y="125" width="190" height="80" rx="8"/><text x="374" y="160" font-size="16">Kafka</text><text x="336" y="184" font-size="13">키 = 지역</text><rect class="box" x="595" y="125" width="180" height="80" rx="8"/><text x="624" y="160" font-size="16">집계 소비자</text><text x="623" y="184" font-size="13">소비자 그룹</text><rect class="box" x="835" y="125" width="130" height="80" rx="8"/><text x="859" y="160" font-size="16">PostgreSQL</text><text x="852" y="184" font-size="13">집계 결과</text><line class="arrow" x1="215" y1="165" x2="310" y2="165"/><line class="arrow" x1="500" y1="165" x2="595" y2="165"/><line class="arrow" x1="775" y1="165" x2="835" y2="165"/><text x="45" y="280" font-size="15" font-weight="700">정합성 보호 흐름</text><text x="45" y="315" font-size="14">같은 eventId 재전달 → processed_events 저장 시도 → 이미 처리된 이벤트면 집계 생략</text><text x="45" y="345" font-size="14">지역별 매출 집계 → PostgreSQL 원자적 갱신 → 읽기-계산-저장 방식의 갱신 손실 방지</text><text x="45" y="375" font-size="13" fill="#6b7280">Kafka는 전달과 순서를 담당하고, PostgreSQL 제약조건과 원자적 갱신으로 데이터 정합성을 보호합니다.</text></svg>
