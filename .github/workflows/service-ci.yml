name: service-ci

on:
  push:
    paths:
      - 'service/**'
      - '.github/workflows/service-ci.yml'
      - 'docker-compose.yml'
      - 'experiments/**'
  pull_request:
    paths:
      - 'service/**'
      - '.github/workflows/service-ci.yml'
      - 'docker-compose.yml'
      - 'experiments/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start PostgreSQL and Kafka
        working-directory: .
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify service including integration tests
        run: mvn -B -ntp -Pintegration verify

      - name: Check experiment script syntax
        working-directory: .
        run: python -m py_compile experiments/replay_duplicate.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            service/target/surefire-reports/
            service/target/failsafe-reports/

      - name: Show infrastructure logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 200

      - name: Stop infrastructure
        if: always()
        working-directory: .
        run: docker compose down
