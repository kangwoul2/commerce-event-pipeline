name: service-ci

on:
  push:
    paths:
      - 'service/**'
      - '.github/workflows/service-ci.yml'
  pull_request:
    paths:
      - 'service/**'
      - '.github/workflows/service-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify service
        run: mvn -B verify
